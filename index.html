function decodeBase64(s){const bin=atob(s);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out.buffer}
function loadEmbeddedVRM(){return new Promise((resolve,reject)=>{try{loader.parse(decodeBase64(MODEL_B64),'',resolve,reject)}catch(e){reject(e)}})}
async function loadVRM(){try{const g=await loadEmbeddedVRM();vrm=g.userData.vrm;if(!vrm)throw new Error('VRMLoader không tạo được VRM');vrm.scene.traverse(o=>o.frustumCulled=false);vrm.scene.rotation.y=Math.PI;scene.add(vrm.scene);if(vrm.lookAt){try{vrm.lookAt.target=lookTarget}catch(e){}}status.innerHTML='<span class="ok">VRM ✓ Humanoid + Skin + SpringBone + Expressions</span><br>Model đã nạp từ bộ nhớ trang.'}catch(e){console.error(e);status.innerHTML='<span class="err">Lỗi VRM: '+(e?.message||e)+'</span>'}}loadVRM();
function expr(n,v){try{vrm?.expressionManager?.setValue(n,Math.max(0,Math.min(1,v)))}catch(e){}}function clearExpr(){['happy','angry','sad','surprised','relaxed','aa','ih','ee','oh','ou'].forEach(n=>expr(n,0));expr('neutral',1)}document.querySelectorAll('[data-expr]').forEach(b=>b.onclick=()=>{clearExpr();if(b.dataset.expr!=='neutral')expr(b.dataset.expr,.9)});$('reset').onclick=()=>{clearExpr();if(vrm){vrm.scene.rotation.set(0,Math.PI,0);const h=vrm.humanoid?.getNormalizedBoneNode('head');if(h)h.rotation.set(0,0,0)}};$('mirror').onclick=()=>{mirrored=!mirrored;video.style.transform=mirrored?'scaleX(1)':'scaleX(-1)'};
async function startMedia(){if(!navigator.mediaDevices?.getUserMedia){status.textContent='Camera/Mic không khả dụng — cần HTTPS.';return}try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480},frameRate:{ideal:24,max:30}},audio:true});video.srcObject=stream;video.classList.remove('hide');await video.play();try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();const src=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=512;micData=new Uint8Array(analyser.fftSize);src.connect(analyser)}catch(e){}status.textContent='Camera ✓ Mic ✓ — đang khởi tạo Face Tracking…';await initTracking()}catch(e){status.textContent='Camera/Mic lỗi: '+e.name+' — '+e.message}}
$('start').onclick=startMedia;
async function initTracking(){if(tracker)return;try{if(!video.videoWidth)await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('Video chưa có kích thước sau 8 giây')),8000);video.addEventListener('loadedmetadata',()=>{clearTimeout(t);resolve()},{once:true})});const mod=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');const {FaceLandmarker,FilesetResolver}=mod;const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');const base={modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'};let lastErr=null;for(const delegate of ['CPU','GPU']){try{tracker=await FaceLandmarker.createFromOptions(fs,{baseOptions:{...base,delegate},runningMode:'VIDEO',numFaces:1,minFaceDetectionConfidence:.4,minFacePresenceConfidence:.4,minTrackingConfidence:.4,outputFaceBlendshapes:true,outputFacialTransformationMatrixes:true});tracking=true;status.textContent='Camera ✓ Mic ✓ Face Tracking ✓ ('+delegate+')';lastVideoTime=-1;lastDetectTs=0;requestAnimationFrame(track);return}catch(e){lastErr=e;tracker=null;console.warn(delegate,e)}}throw lastErr||new Error('Không tạo được FaceLandmarker')}catch(e){tracking=false;tracker=null;status.textContent='Camera ✓ Mic ✓ — Face Tracking lỗi: '+(e?.message||e);console.error(e)}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function track(){requestAnimationFrame(track);if(!tracking||!tracker||video.readyState<2||!video.videoWidth)return;if(video.currentTime===lastVideoTime)return;lastVideoTime=video.currentTime;const ts=Math.max(performance.now(),lastDetectTs+1);lastDetectTs=ts;try{const r=tracker.detectForVideo(video,ts);if(r?.faceLandmarks?.[0])applyFace(r.faceLandmarks[0]);else{expr('blink',0);expr('aa',0);expr('oh',0)}}catch(e){console.warn('face frame',e)}}
function applyFace(l){if(!vrm)return;const nose=l[1],le=l[33],re=l[263],cx=(le.x+re.x)/2,eyeW=dist(le,re)||.25;const head=vrm.humanoid?.getNormalizedBoneNode('head');if(head){const yaw=(nose.x-cx)/eyeW*.9,pitch=(nose.y-(le.y+re.y)/2)/eyeW*.75;head.rotation.y=THREE.MathUtils.lerp(head.rotation.y,yaw,.22);head.rotation.x=THREE.MathUtils.lerp(head.rotation.x,pitch,.22)}lookTarget.position.set((cx-.5)*2.2,(.5-((le.y+re.y)/2))*1.8,-1);const blinkL=1-Math.min(1,dist(l[159],l[145])/(dist(l[33],l[133])*.42)),blinkR=1-Math.min(1,dist(l[386],l[374])/(dist(l[362],l[263])*.42));const blink=Math.max(blinkL,blinkR);expr('blink',blink);const mouth=dist(l[13],l[14])/(dist(l[61],l[291])||.2);let open=Math.min(1,Math.max(0,(mouth-.12)/.18));if(analyser){analyser.getByteTimeDomainData(micData);let s=0;for(const x of micData){const q=(x-128)/128;s+=q*q}open=Math.max(open,Math.min(1,Math.sqrt(s/micData.length)*3))}expr('aa',open);expr('oh',open*.65);if(open>.55&&blink<.2)expr('surprised',Math.max(0,open*.55))}
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(.033,clock.getDelta());if(vrm)vrm.update(dt);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});addEventListener('pagehide',()=>{stream?.getTracks().forEach(t=>t.stop());audioCtx?.close()});clearExpr();
