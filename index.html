<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020711">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lục Trần V8 • Reference Avatar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="artWrap">
    <img id="art" src="luc_tran_reference.jpg" alt="Lục Trần" draggable="false">
    <div id="aura"></div>
    <div id="glow"></div>
  </div>
</div>
<video id="camera" autoplay muted playsinline></video>
<header><b>LỤC TRẦN</b><span id="status">Ảnh tham chiếu • Sẵn sàng</span></header>
<section id="startCard">
  <div class="seal">✦</div>
  <h1>LỤC TRẦN</h1>
  <div class="sub">REFERENCE AVATAR • V8</div>
  <button id="start">🎥 BẬT CAMERA + MIC</button>
  <button id="retry" hidden>↻ THỬ LẠI</button>
  <p id="message">V8 dùng chính ảnh Lục Trần bạn cung cấp làm hình ảnh nhân vật, nên diện mạo/trang phục/aura giữ đúng ảnh tham chiếu.</p>
  <div class="checks">
    <span id="cameraState" class="state wait">Camera: CHỜ</span>
    <span id="micState" class="state wait">Mic: CHỜ</span>
    <span id="faceState" class="state wait">Face Tracking: CHỜ</span>
  </div>
  <div id="permission" hidden></div>
</section>
<div id="controls" hidden>
  <button id="reset">◎</button><button id="mic">🎙</button><button id="mirror">⇋</button><button id="fx">✦</button>
</div>
<div id="tip">Nghiêng đầu • Camera/Mic • Parallax theo khuôn mặt • Aura</div>
<script>
const $=id=>document.getElementById(id);
const video=$("camera"), start=$("start"), retry=$("retry"), art=$("art"), artWrap=$("artWrap"), aura=$("aura"), glow=$("glow");
let stream=null,audio=null,analyser=null,audioData=null,muted=false,fx=true,mirrored=false,running=false,faceLoaded=false,faceSeen=false,landmarker=null,lastVideoTime=-1;
let tr={x:0,y:0,r:0,voice:0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
function state(id,text,type){$(id).textContent=text;$(id).className="state "+type}
function msg(s){$("message").textContent=s}
function help(n){return "iPhone: Cài đặt → Ứng dụng → Safari → "+n+" → Hỏi hoặc Cho phép. Sau đó quay lại trang và bấm THỬ LẠI."}
function err(title,detail,fix){$("status").textContent=title;msg(detail);$("permission").hidden=false;$("permission").innerHTML="<b>Hướng dẫn:</b><br>"+fix;$("permission").className="error";start.hidden=false;retry.hidden=false}
async function requestMedia(){
 if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){let e=new Error("API unavailable");e.name="Unsupported";throw e}
 try{
  const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"user"},width:{ideal:720},height:{ideal:1280},frameRate:{ideal:30,max:30}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});
  stream=s;video.srcObject=s;await video.play();
  return {camera:s.getVideoTracks().some(t=>t.readyState==="live"),mic:s.getAudioTracks().some(t=>t.readyState==="live")}
 }catch(e){throw e}
}
async function setupMic(){
 const trk=stream?.getAudioTracks?.()[0]; if(!trk)return false;
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
 try{audio=new AC();await audio.resume();const src=audio.createMediaStreamSource(new MediaStream([trk]));analyser=audio.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.7;audioData=new Uint8Array(analyser.fftSize);src.connect(analyser);return true}catch(e){return false}
}
async function loadFace(){
 try{
  const mod=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm");
  const FS=await mod.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm");
  landmarker=await mod.FaceLandmarker.createFromOptions(FS,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},runningMode:"VIDEO",numFaces:1});
  faceLoaded=true;state("faceState","Face Tracking: ĐÃ TẢI","ok");return true;
 }catch(e){state("faceState","Face Tracking: LỖI","bad");return false}
}
function readMic(){if(!analyser||muted){tr.voice=lerp(tr.voice,0,.2);return}analyser.getByteTimeDomainData(audioData);let q=0;for(const n of audioData){let z=(n-128)/128;q+=z*z}tr.voice=lerp(tr.voice,clamp(Math.sqrt(q/audioData.length)*4,0,1),.25)}
function trackFace(){if(!faceLoaded||!landmarker||video.readyState<2||video.currentTime===lastVideoTime)return;lastVideoTime=video.currentTime;try{const r=landmarker.detectForVideo(video,performance.now());const p=r.faceLandmarks?.[0];if(!p)return;faceSeen=true;state("faceState","Face Tracking: OK","ok");tr.x=clamp((.5-p[1].x)*1.8,-1,1);tr.y=clamp((p[1].y-.47)*1.4,-1,1);tr.r=clamp(Math.atan2(p[263].y-p[33].y,p[263].x-p[33].x),-.55,.55)}catch(e){}}
function render(){
 readMic();trackFace();
 const x=tr.x*14,y=tr.y*9,rot=tr.r*1.8,scale=1+tr.voice*.008;
 art.style.transform=`translate3d(${x}px,${y}px,0) rotate(${rot}deg) scale(${scale}) ${mirrored?'scaleX(-1)':''}`;
 artWrap.style.setProperty('--px',`${x*.18}px`);artWrap.style.setProperty('--py',`${y*.18}px`);
 glow.style.opacity=fx?(0.25+tr.voice*.25):0;aura.style.opacity=fx?(0.55+tr.voice*.35):0;
 requestAnimationFrame(render)
}
async function startApp(){
 start.disabled=true;retry.hidden=true;$("permission").hidden=true;msg("Đang xin Camera + Microphone…");
 try{
  const r=await requestMedia();
  state("cameraState",r.camera?"Camera: OK":"Camera: LỖI",""+(r.camera?"ok":"bad"));
  state("micState",r.mic?"Mic: OK":"Mic: LỖI",""+(r.mic?"ok":"bad"));
  if(!r.camera||!r.mic)throw Object.assign(new Error("Thiếu quyền"),{name:"NotAllowedError"});
  await setupMic();
  $("startCard").hidden=true;$("controls").hidden=false;running=true;$('status').textContent='Camera + Mic • Đã kết nối';
  msg("Camera và Mic đã hoạt động. Đang tải Face Tracking độc lập…");
  const ok=await loadFace();
  if(!ok)msg("Camera + Mic vẫn hoạt động; Face Tracking không tải được. Bạn có thể bấm THỬ LẠI sau.");
 }catch(e){
  let fix="";
  if(e.name==="NotAllowedError"||e.name==="SecurityError")fix=help("Camera / Microphone");
  else if(e.name==="Unsupported")fix="Mở trang bằng Safari trên iPhone và dùng HTTPS GitHub Pages.";
  else fix="Kiểm tra kết nối mạng rồi bấm THỬ LẠI.";
  err("Không bật được Camera + Mic",e.message||"Safari đã từ chối quyền.",fix);state("cameraState","Camera: LỖI","bad");state("micState","Mic: LỖI","bad");start.disabled=false;retry.hidden=false;
 }
}
start.addEventListener('click',startApp);retry.addEventListener('click',startApp);
$("reset").addEventListener('click',()=>{tr.x=tr.y=tr.r=0});$("mic").addEventListener('click',()=>{muted=!muted;$("mic").textContent=muted?'🔇':'🎙'});$("mirror").addEventListener('click',()=>{mirrored=!mirrored});$("fx").addEventListener('click',()=>{fx=!fx});
window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));
render();
</script>
</body></html>
