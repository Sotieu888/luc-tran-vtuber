<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#030811">
<title>Lục Trần — Vạn Giới VTuber</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stage"></canvas>
<video id="cam" autoplay muted playsinline></video>

<header>
  <b>LỤC TRẦN</b>
  <small id="status">Sẵn sàng</small>
</header>

<section id="intro">
  <div class="seal">☯</div>
  <h1>LỤC TRẦN</h1>
  <p>VẠN GIỚI VTUBER</p>
  <button id="start">🎥 BẬT CAMERA + MIC</button>
  <small id="help">Phong cách: tóc đen dài • mắt lam • bạch y tiên hiệp</small>
</section>

<nav id="tools" hidden>
  <button id="center">◎</button>
  <button id="mute">🎙</button>
  <button id="mirror">⇋</button>
  <button id="aura">✦</button>
</nav>
<div id="hint">Nghiêng đầu • Chớp mắt • Nói vào mic</div>
<script src="app.js"></script>
</body>
</html>
