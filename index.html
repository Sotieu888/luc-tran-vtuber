<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020711">
<title>Lục Trần — Vạn Giới VTuber V3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<video id="cam" autoplay muted playsinline></video>
<canvas id="stage"></canvas>

<header>
  <b>LỤC TRẦN</b>
  <span id="status">Sẵn sàng</span>
</header>

<section id="intro">
  <div class="seal">☯</div>
  <h1>LỤC TRẦN</h1>
  <p>VẠN GIỚI • LAYERED VTUBER</p>
  <button id="start">🎥 BẬT CAMERA + MIC</button>
  <small id="help">Model tách lớp: đầu • tóc • mắt • miệng • thân • tay áo • kiếm • aura</small>
</section>

<nav id="tools" hidden>
  <button id="center">◎</button>
  <button id="mute">🎙</button>
  <button id="mirror">⇋</button>
  <button id="aura">✦</button>
</nav>

<div id="hint">Nghiêng đầu • Chớp mắt • Đảo mắt • Nói vào mic</div>
<script type="module" src="app.js"></script>
</body>
</html>
