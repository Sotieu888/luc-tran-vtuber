<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lục Trần TRUE 3D</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:#020712;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh}.top,.panel{margin:12px;padding:14px;border:1px solid #203a56;border-radius:18px;background:#06101d}.top{display:flex;justify-content:space-between;gap:12px}.title{font-weight:900;letter-spacing:.12em}.sub{color:#8bdcff;font-size:12px}
#stage{margin:0 12px;height:70vh;min-height:480px;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#12395b,#020712 65%)}canvas{width:100%;height:100%;display:block}
.state{display:inline-block;padding:7px 10px;border-radius:999px;background:#0b1725;color:#a9b8c8;font-size:12px;margin:2px}.ok{color:#baffd0;border:1px solid #1d6a3b}.wait{color:#ffe6a0;border:1px solid #6a5520}.bad{color:#ffbaba;border:1px solid #703333}
button{padding:12px 14px;border:0;border-radius:13px;background:#10243a;color:#fff;font-weight:800;margin:7px 4px 0 0}.primary{background:#1477c8}
#err{margin-top:8px;color:#b8cbe0;font-size:13px;line-height:1.45}video{display:none}
</style></head>
<body><div class="app">
<div class="top"><div class="title">LỤC TRẦN</div><div class="sub">TRUE 3D • GLB</div></div>
<div id="stage"><canvas id="view"></canvas></div><video id="video" playsinline muted></video>
<div class="panel"><div>
<span id="cam" class="state">Camera: CHỜ</span><span id="mic" class="state">Mic: CHỜ</span><span id="face" class="state">Face Tracking: CHỜ</span>
</div><div>
<button id="start" class="primary">🎥 BẬT CAMERA + MIC</button><button id="retry" hidden>↻ THỬ LẠI</button>
<button id="mirror">⇄ Gương</button><button id="aura">✦ Aura</button><button id="reset">◎ Reset</button>
</div><div id="err">Đầu, mắt, miệng, tóc, tay áo, kiếm và aura là các thành phần 3D riêng.</div></div></div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/+esm";
import {GLTFLoader} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";
const $=id=>document.getElementById(id), video=$("video"), canvas=$("view");
const scene=new THREE.Scene(); scene.fog=new THREE.Fog(0x020712,4,10);
const camera=new THREE.PerspectiveCamera(32,1,.05,30); camera.position.set(0,1.25,5.2);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.6)); renderer.outputColorSpace=THREE.SRGBColorSpace;
scene.add(new THREE.HemisphereLight(0xc7ecff,0x08101d,2.1)); const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(2,4,4);scene.add(key);
const rim=new THREE.PointLight(0x2fa8ff,5,7);rim.position.set(-2,2,2);scene.add(rim);
let model=null,parts={},stream=null,landmarker=null,faceReady=false,lastFace=0,lastFaceRun=0,mirror=false,auraOn=true;
let target={x:0,y:0,r:0},smooth={x:0,y:0,r:0};
function st(id,t,c){const e=$(id);e.textContent=t;e.className="state "+(c||"")}
function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener("resize",resize);resize();
new GLTFLoader().load("./luc_tran_3d.glb",g=>{model=g.scene;model.position.y=-1.05;model.scale.setScalar(1.35);scene.add(model);model.traverse(o=>{if(o.isMesh)parts[o.name]=o})},undefined,e=>{$("err").textContent="Không tải được GLB: "+e.message});
function stop(){if(stream){stream.getTracks().forEach(t=>{try{t.stop()}catch{}});stream=null}video.srcObject=null}
async function media(){if(!navigator.mediaDevices?.getUserMedia)throw Error("Safari không hỗ trợ Camera/Microphone API.");stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"user"},width:{ideal:720},height:{ideal:1280},frameRate:{ideal:30,max:30}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});video.srcObject=stream;await video.play();st("cam","Camera: OK","ok");st("mic","Mic: OK","ok")}
async function face(){try{const m=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm");const fs=await m.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm");landmarker=await m.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},runningMode:"VIDEO",numFaces:1});faceReady=true;st("face","Face Tracking: ĐANG QUÉT","wait")}catch(e){st("face","Face Tracking: LỖI","bad")}}
async function start(){ $("start").disabled=true;stop();st("cam","Camera: ĐANG KẾT NỐI","wait");st("mic","Mic: ĐANG KẾT NỐI","wait");st("face","Face Tracking: CHỜ","wait");try{await media();$("retry").hidden=false;await face()}catch(e){stop();st("cam","Camera: LỖI","bad");st("mic","Mic: LỖI","bad");$("err").textContent="Không bật được Camera/Mic. Safari → Cài đặt → Ứng dụng → Safari → Camera/Microphone → Cho phép.";$("retry").hidden=false} $("start").disabled=false}
$("start").onclick=start;$("retry").onclick=start;$("mirror").onclick=()=>mirror=!mirror;$("aura").onclick=()=>auraOn=!auraOn;$("reset").onclick=()=>{target={x:0,y:0,r:0};smooth={x:0,y:0,r:0}};
function faceTick(now){if(!faceReady||!landmarker||video.readyState<2||now-lastFaceRun<50)return;lastFaceRun=now;try{const r=landmarker.detectForVideo(video,now),p=r.faceLandmarks?.[0];if(!p){if(now-lastFace>1400)st("face","Face Tracking: CHƯA THẤY MẶT","wait");return}lastFace=now;st("face","Face Tracking: OK","ok");target.x=THREE.MathUtils.clamp((.5-p[1].x)*1.8,-1,1);target.y=THREE.MathUtils.clamp((p[1].y-.47)*1.4,-1,1);target.r=THREE.MathUtils.clamp(Math.atan2(p[263].y-p[33].y,p[263].x-p[33].x),-.55,.55)}catch{}}
function animate(now=0){requestAnimationFrame(animate);faceTick(now);smooth.x=THREE.MathUtils.lerp(smooth.x,target.x,.08);smooth.y=THREE.MathUtils.lerp(smooth.y,target.y,.08);smooth.r=THREE.MathUtils.lerp(smooth.r,target.r,.07);if(model){model.rotation.y=smooth.x*.20*(mirror?-1:1);model.rotation.x=-smooth.y*.10;if(parts.Head)parts.Head.rotation.z=smooth.r*.7;model.position.y=-1.05+Math.sin(now*.0017)*.008;["Hair_Cap","Hair_Lock_1","Hair_Lock_2","Hair_Lock_3","Hair_Lock_4","Hair_Lock_5","Hair_Lock_6"].forEach((n,i)=>{if(parts[n])parts[n].rotation.z+=Math.sin(now*.002+i)*.0008});["Sleeve_L","Sleeve_R"].forEach((n,i)=>{if(parts[n])parts[n].rotation.y=Math.sin(now*.0015+i)*.035});if(parts.Mouth)parts.Mouth.scale.y=1+Math.abs(Math.sin(now*.006))*.12;["Aura_Ring_1","Aura_Ring_2","Aura_Ring_3"].forEach((n,i)=>{if(parts[n]){parts[n].visible=auraOn;parts[n].rotation.z=now*.0002*(i+1)}});if(parts.Sword_Blade)parts.Sword_Blade.rotation.z=-.12+Math.sin(now*.0012)*.015}renderer.render(scene,camera)}animate();
</script></body></html>
